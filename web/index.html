<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>나무덤프</title>
<link rel="icon" href="/icon.png">
<link rel="stylesheet" href="/katex/katex.min.css">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/content.css">
<style id="nd-wiki-css"></style>
</head>
<body>
<header class="nd-topbar" id="nd-topbar">
  <div class="nd-topbar-in">
    <div class="nd-navbtns">
      <button class="nd-ib" id="nd-back" title="뒤로 (⌘[)" aria-label="뒤로"></button>
      <button class="nd-ib" id="nd-fwd" title="앞으로 (⌘])" aria-label="앞으로"></button>
      <button class="nd-ib" id="nd-home" title="처음 화면 (⌘⇧H)" aria-label="처음 화면"></button>
    </div>
    <div class="nd-brand-slot">
      <a class="nd-brand" href="/" data-route title="처음 화면">
        <span class="nd-brand-t">나무덤프</span><span class="nd-brand-doc" id="nd-brand-doc"></span>
      </a>
    </div>
    <div class="nd-search" id="nd-search">
      <span class="nd-search-ic" aria-hidden="true"></span>
      <input id="nd-q" type="search" placeholder="문서 제목 검색" autocomplete="off" spellcheck="false" aria-label="문서 제목 검색">
      <kbd class="nd-kbd" id="nd-q-kbd">⌘K</kbd>
      <div class="nd-sugg" id="nd-sugg" role="listbox" hidden></div>
    </div>
    <div class="nd-actions">
      <button class="nd-ib" id="nd-star" title="즐겨찾기 (⌘D)" aria-label="즐겨찾기" style="visibility:hidden" disabled></button>
      <button class="nd-ib" id="nd-random" title="아무 문서나 열기 (⌘R)" aria-label="임의 문서"></button>
      <button class="nd-ib" id="nd-lists" title="보관함: 최근 본 문서, 즐겨찾기 (⌘Y)" aria-label="보관함"></button>
      <button class="nd-ib" id="nd-theme" title="화면 모드" aria-label="화면 모드"></button>
      <button class="nd-ib" id="nd-settings" title="설정 (⌘,)" aria-label="설정"></button>
    </div>
  </div>
  <div class="nd-progress" id="nd-progress"></div>
</header>

<main class="nd-main" id="nd-main">
  <div class="nd-layout" id="nd-layout">
    <div class="nd-page" id="nd-page"></div>
    <aside class="nd-side" id="nd-side" hidden>
      <div class="nd-side-in">
        <div class="nd-side-h">목차</div>
        <nav class="nd-side-toc" id="nd-side-toc"></nav>
      </div>
    </aside>
  </div>
</main>

<div class="nd-find" id="nd-find" hidden>
  <input id="nd-find-q" type="search" placeholder="문서 안에서 찾기" autocomplete="off" spellcheck="false">
  <span class="nd-find-n" id="nd-find-n"></span>
  <button class="nd-ib nd-sm" id="nd-find-prev" title="이전 (⇧↩)" aria-label="이전"></button>
  <button class="nd-ib nd-sm" id="nd-find-next" title="다음 (↩)" aria-label="다음"></button>
  <button class="nd-ib nd-sm" id="nd-find-close" title="닫기 (Esc)" aria-label="닫기"></button>
</div>

<div class="nd-scrim" id="nd-scrim" hidden></div>
<aside class="nd-drawer" id="nd-drawer" hidden aria-label="보관함">
  <div class="nd-drawer-h">
    <div class="nd-seg" id="nd-drawer-tabs">
      <button data-tab="history" class="on">최근 본 문서</button>
      <button data-tab="bookmarks">즐겨찾기</button>
    </div>
    <button class="nd-ib nd-sm" id="nd-drawer-close" aria-label="닫기"></button>
  </div>
  <div class="nd-drawer-b" id="nd-drawer-b"><div class="nd-drawer-list" id="nd-drawer-list"></div></div>
  <div class="nd-drawer-foot" id="nd-drawer-foot" hidden></div>
</aside>

<div class="nd-modal" id="nd-modal" hidden role="dialog" aria-modal="true" aria-labelledby="nd-modal-t">
  <div class="nd-modal-card"><div class="nd-modal-in">
    <div class="nd-modal-h"><h2 id="nd-modal-t">설정</h2><button class="nd-ib nd-sm" id="nd-modal-close" aria-label="닫기"></button></div>
    <div class="nd-modal-sc" id="nd-modal-sc"><div class="nd-modal-b" id="nd-modal-b"></div></div>
  </div></div>
</div>

<div class="nd-pop" id="nd-pop" hidden></div>
<div class="nd-toast" id="nd-toast" hidden></div>
<button class="nd-totop" id="nd-totop" title="맨 위로" aria-label="맨 위로" hidden></button>

<script src="/render.js"></script>
<script src="/app.js"></script>
</body>
</html>
