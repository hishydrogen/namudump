<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>나무덤프</title>
<link rel="icon" href="/icon.png">
<link rel="stylesheet" href="/katex/katex.min.css">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/content.css">
<style id="nd-wiki-css"></style>
</head>
<body>
<div class="nd-progress" id="nd-progress"></div>

<main class="nd-main" id="nd-main">
  <div class="nd-layout" id="nd-layout">
    <div class="nd-page" id="nd-page"></div>
  </div>
</main>

<div class="nd-find" id="nd-find" hidden>
  <input id="nd-find-q" type="search" placeholder="문서 안에서 찾기" autocomplete="off" spellcheck="false">
  <span class="nd-find-n" id="nd-find-n"></span>
  <button class="nd-ib nd-sm" id="nd-find-prev" title="이전 (⇧↩)" aria-label="이전"></button>
  <button class="nd-ib nd-sm" id="nd-find-next" title="다음 (↩)" aria-label="다음"></button>
  <button class="nd-ib nd-sm" id="nd-find-close" title="닫기 (Esc)" aria-label="닫기"></button>
</div>

<div class="nd-pop" id="nd-pop" hidden></div>
<div class="nd-toast" id="nd-toast" hidden></div>
<button class="nd-totop" id="nd-totop" title="맨 위로" aria-label="맨 위로" hidden></button>

<script src="/render.js"></script>
<script src="/app.js"></script>
</body>
</html>
